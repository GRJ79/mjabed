<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<title>المجابيد</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;flex-direction:column;padding:20px;
background:radial-gradient(ellipse at center,#16130e,#030303 80%) #050505;color:#e8c55a;
font-family:Tahoma,"Segoe UI",sans-serif;text-align:center;user-select:none}
img{width:130px;height:130px;border-radius:26px;box-shadow:0 0 30px #d4af3744}
h1{margin:18px 0 6px;font-size:26px}
p{margin:0;opacity:.85;line-height:1.8}
.sp{width:46px;height:46px;margin:26px auto 18px;border:4px solid #d4af3733;border-top-color:#d4af37;border-radius:50%;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
small{display:block;margin-top:10px;opacity:.55}
</style></head><body>
<img src="/icon-192.png" alt="">
<h1>المجابيد</h1>
<div class="sp"></div>
<p id="t">جاري تحميل اللعبة...</p>
<small>أول مرة قد تستغرق حتى دقيقة، لا تقفل الشاشة</small>
<script>
(function(){
  var n=0;
  function go(){ location.replace('/?live=1'); }
  function tick(){
    n++;
    if(n>6) document.getElementById('t').textContent='لا زال التحميل جاريًا، لحظات فقط...';
    var c=new AbortController(), to=setTimeout(function(){c.abort()},8000);
    fetch('/chk?room=ping&t='+Date.now(),{cache:'no-store',signal:c.signal})
      .then(function(r){ return r.ok ? r.text() : ''; })
      .then(function(x){ clearTimeout(to); x=(x||'').trim(); if(x==='ok'||x==='no') go(); else setTimeout(tick,3000); })
      .catch(function(){ clearTimeout(to); setTimeout(tick,3000); });
  }
  tick();
})();
</script></body></html>
